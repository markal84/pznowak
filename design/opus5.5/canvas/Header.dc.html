<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Nagłówek strony</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&amp;family=Schibsted+Grotesk:wght@400..700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<header style="font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #22262A; background: #E7E8E3; border-bottom: 1px solid #C9CBC4">
  <div class="pad" style="max-width: 1320px; margin: 0 auto; padding: 18px 40px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 40px">
    <a href="Main.dc.html" aria-label="Michał Nowak, pracownia złotnicza — strona główna" style="display: flex; align-items: center; gap: 18px; text-decoration: none; color: #22262A">
      <img src="/_blob/80fbd8ae27f6887ea4723494333c3e7e" alt="" style="display: block; height: 62px; width: auto">
      <span aria-hidden="true" style="width: 1px; align-self: stretch; margin: 8px 0; background: #A9AAA3"></span>
      <span style="display: flex; flex-direction: column; gap: 2px; font-size: 13px; line-height: 1.3; color: #3A3F43">
        <span>Pracownia złotnicza</span>
        <span>Busko-Zdrój, od 1890</span>
      </span>
    </a>
    <nav aria-label="Menu główne" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 26px; font-size: 15px">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="5">
        <a class="navl" href="{{l.href}}" aria-current="{{l.current}}" style="{{l.style}}">{{l.label}}</a>
      </sc-for>
    </nav>
    <a class="btn" href="Kontakt.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 24px; border-radius: 999px; background: #1D3832; color: #F3F4EF; font-size: 15px; font-weight: 500; text-decoration: none">Umów wizytę</a>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","katalog","obraczki","zamowienie","naprawy","realizacje","pracownia","kontakt"],"default":"home"},"$preview":{"width":1440,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const items = [
      { id: 'katalog', label: 'Pierścionki', href: 'Katalog.dc.html' },
      { id: 'obraczki', label: 'Obrączki', href: 'Obraczki.dc.html' },
      { id: 'zamowienie', label: 'Na zamówienie', href: 'NaZamowienie.dc.html' },
      { id: 'naprawy', label: 'Naprawy', href: 'Naprawy.dc.html' },
      { id: 'realizacje', label: 'Realizacje', href: 'Realizacje.dc.html' },
      { id: 'pracownia', label: 'Pracownia', href: 'Pracownia.dc.html' }
    ];
    return {
      links: items.map((it) => ({
        ...it,
        current: it.id === active ? 'page' : undefined,
        style: it.id === active
          ? 'color: #22262A; font-weight: 600; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 7px; padding: 10px 0'
          : 'color: #3A3F43; padding: 10px 0'
      }))
    };
  }
}
</script>
</body>
</html>
