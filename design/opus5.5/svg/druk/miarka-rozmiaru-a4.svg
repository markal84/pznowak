<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" role="img" aria-labelledby="t"><title id="t">Miarka rozmiaru pierścionka do wydruku</title><rect width="210" height="297" fill="#FFFFFF"/><text x="20" y="26" font-size="9" font-family="Georgia, serif" fill="#22262A">Miarka rozmiaru pierścionka</text><text x="20" y="34" font-size="3.6" font-family="Helvetica, Arial, sans-serif" fill="#3A3F43">Wydrukuj w skali 100%, bez dopasowania do strony. Połóż pierścionek na kółkach:</text><text x="20" y="39" font-size="3.6" font-family="Helvetica, Arial, sans-serif" fill="#3A3F43">właściwy rozmiar to kółko, którego linia jest widoczna dokładnie po wewnętrznej krawędzi.</text><path d="M20 50 H70" stroke="#22262A" stroke-width=".4"/><path d="M20 48 V52" stroke="#22262A" stroke-width=".3"/><path d="M30 48 V52" stroke="#22262A" stroke-width=".3"/><path d="M40 48 V52" stroke="#22262A" stroke-width=".3"/><path d="M50 48 V52" stroke="#22262A" stroke-width=".3"/><path d="M60 48 V52" stroke="#22262A" stroke-width=".3"/><path d="M70 48 V52" stroke="#22262A" stroke-width=".3"/><text x="74" y="51.3" font-size="3.4" font-family="Helvetica, Arial, sans-serif" fill="#3A3F43">kontrola wydruku: ten odcinek ma mieć dokładnie 50 mm</text><text x="20" y="62" font-size="3.2" font-family="Helvetica, Arial, sans-serif" fill="#575C5F">Rozmiar polski = obwód wewnętrzny w mm minus 40. Pod numerem: średnica wewnętrzna.</text><circle cx="30" cy="92" r="7.639" fill="none" stroke="#22262A" stroke-width=".25"/><path d="M29 92 H31 M30 91 V93" stroke="#22262A" stroke-width=".15"/><text x="30" y="108.5" text-anchor="middle" font-size="4.2" font-family="Georgia, serif" fill="#22262A">8</text><text x="30" y="113.0" text-anchor="middle" font-size="2.6" font-family="Helvetica, Arial, sans-serif" fill="#575C5F">15.3 mm</text><circle cx="60" cy="92" r="7.799" fill="none" stroke="#22262A" stroke-width=".25"/><path d="M59 92 H61 M60 91 V93" stroke="#22262A" stroke-width=".15"/><te