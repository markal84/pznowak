<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Przegląd postów z FB</title>
<style>
:root{color-scheme:light dark;
  --bg:#f6f3ee;--fg:#22201c;--muted:#6f6a62;--card:#fff;--soft:#efeae2;--line:#ddd6ca;
  --gold:#8a6a2f;--gold-soft:#f3ead6;--ok:#2f7d4f;--ok-soft:#e3f2e8;--blue:#2c5d8f;--blue-soft:#e4edf6;
  --warn:#9a5b00;--warn-soft:#fbefd9;--bad:#b3261e;--bad-soft:#fbe4e1;--grey:#7a756d;--grey-soft:#eeebe6;
  --shadow:0 1px 2px #0000000f,0 4px 14px #0000000d;--r:14px}
@media (prefers-color-scheme:dark){:root{
  --bg:#17150f;--fg:#efebe3;--muted:#a59e92;--card:#221f19;--soft:#2b2720;--line:#3a352c;
  --gold:#d8b46a;--gold-soft:#3a3020;--ok:#7cc795;--ok-soft:#1f3326;--blue:#8db8e6;--blue-soft:#1d2a38;
  --warn:#f0b452;--warn-soft:#3a2e17;--bad:#f08a80;--bad-soft:#3d1f1c;--grey:#a8a298;--grey-soft:#2c2924;--shadow:0 1px 2px #0006,0 6px 18px #0005}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;min-height:40px}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
a{color:var(--blue)}
.primary{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){.primary{color:#17150f}}
.primary:hover{filter:brightness(1.07);border-color:var(--gold)}
.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.ghost:hover{background:var(--soft);border-color:transparent}
.small{font-size:14px;padding:4px 10px;min-height:32px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- nagłówek ---------- */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.top h1{font-size:18px;margin:0;flex:1 1 220px;font-weight:650;letter-spacing:-.01em}
.top h1 small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
#status{font-size:14px;color:var(--muted);white-space:nowrap}
#status.err{color:var(--bad);font-weight:600}
#status.ok::before{content:"✓ ";color:var(--ok)}
.top a.det{font-size:14px;color:var(--muted)}
#banner{max-width:1320px;margin:0 auto;padding:0 16px}
#banner .b{margin-top:12px;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:var(--r);padding:12px 14px;font-weight:600}
#banner .b.info{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
#banner .b button{margin:6px 6px 0 0;font-weight:500;color:var(--fg)}
#banner code{background:var(--card);border-radius:6px;padding:1px 6px;font-weight:400;color:var(--fg)}
body.nosync .needsync{pointer-events:none;opacity:.45}

/* ---------- tablica ---------- */
main{max-width:1320px;margin:0 auto;padding:16px 16px 80px}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.hero .msg{flex:1 1 280px}
.hero .msg b{font-size:20px;display:block;line-height:1.3}
.hero .msg span{color:var(--muted)}
.hero .go{font-size:17px;padding:12px 22px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted);margin:14px 2px 0}
.flow b{color:var(--fg);font-weight:600}
.flow .arr{opacity:.6}
.scope{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);margin-left:auto}
.scope button{border:0;border-radius:999px;min-height:32px;padding:4px 14px;font-size:14px;background:transparent}
.scope button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px;align-items:start}
@media (max-width:1100px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.col{background:var(--soft);border-radius:var(--r);padding:12px;min-width:0}
.col h2{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.col h2 .n{margin-left:auto;font-size:13px;font-weight:600;border-radius:999px;padding:1px 10px;background:var(--card);color:var(--muted)}
.col .sub{margin:2px 0 10px;font-size:13px;color:var(--muted)}
.col .dot{width:10px;height:10px;border-radius:50%;flex:none}
.col.todo .dot{background:var(--warn)}.col.ready .dot{background:var(--ok)}.col.done .dot{background:var(--blue)}.col.out .dot{background:var(--grey)}
.col.todo{background:var(--warn-soft)}
.col .empty{font-size:14px;color:var(--muted);padding:14px 6px;text-align:center}
.col .more{width:100%;margin-top:4px;font-size:14px}
.tile{display:flex;gap:10px;width:100%;text-align:left;align-items:center;padding:8px;margin:0 0 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--gold)}
.tile .ph{position:relative;flex:none;width:64px;height:64px;border-radius:9px;overflow:hidden;background:var(--soft)}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph .play{position:absolute;inset:auto auto 4px 4px;background:#000a;color:#fff;font-size:11px;border-radius:6px;padding:0 5px;line-height:1.6}
.tile .ph .plus{position:absolute;right:4px;top:4px;background:#000a;color:#fff;font-size:11px;border-radius:6px;padding:0 5px;line-height:1.6}
.tile .tx{min-width:0;display:flex;flex-direction:column;gap:2px}
.tile .d{font-size:12px;color:var(--muted)}
.tile .t{font-size:14px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;line-height:1.6;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.new{background:var(--gold-soft);color:var(--gold)}
.chip.to{background:var(--ok-soft);color:var(--ok)}
.chip.done{background:var(--blue-soft);color:var(--blue)}
.chip.out{background:var(--grey-soft);color:var(--grey)}
.chip.todo{background:var(--soft);color:var(--muted);font-weight:500}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- przegląd jednego posta ---------- */
#focus{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
#focus[hidden]{display:none}
.fbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.fbar .where{flex:1;min-width:0;text-align:center;font-size:14px;color:var(--muted)}
.fbar .where b{color:var(--fg)}
.prog{height:4px;background:var(--soft)}
.prog i{display:block;height:100%;background:var(--gold);transition:width .3s}
.fbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,1fr);overflow:hidden}
@media (max-width:900px){.fbody{display:block;overflow:auto}}
.viewer{display:flex;flex-direction:column;min-height:0;background:#0f0e0c;padding:12px;gap:10px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.stage img,.stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#000}
@media (max-width:900px){.viewer{height:46vh;min-height:280px}}
@media (max-width:520px){.fbar .pos{display:none}}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;flex:none}
.strip button{flex:none;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;width:64px;height:64px;background:#222;min-height:0;position:relative}
.strip button[aria-current=true]{border-color:var(--gold)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.strip .play{position:absolute;left:3px;bottom:3px;background:#000b;color:#fff;font-size:10px;border-radius:5px;padding:0 4px}
.strip .from{position:absolute;right:3px;top:3px;background:var(--gold);color:#fff;font-size:10px;border-radius:5px;padding:0 4px}
.vcap{color:#cfc8bc;font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;flex:none}
.vcap a{color:#e9d3a3}
.panel{overflow:auto;padding:18px 20px 40px}
@media (max-width:900px){.panel{overflow:visible;padding:16px}}
.panel h2{font-size:22px;margin:0 0 4px;line-height:1.25;letter-spacing:-.01em}
.panel h3{font-size:16px;margin:22px 0 8px}
.panel .ptext{font-size:14px;color:var(--muted)}
.panel .ptext summary{cursor:pointer}
.panel .ptext p{white-space:pre-wrap;margin:6px 0 0;color:var(--fg)}
.sug{border:2px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:14px;margin-top:16px}
.sug .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gold)}
.sug .say{font-size:17px;margin:4px 0 10px;line-height:1.4}
.sug .why{font-size:13px;color:var(--muted);margin-top:8px}
.sug .yesno{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sug .yesno button{flex:1 1 180px;font-size:16px;padding:12px}
.ring{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.ring img.big{width:132px;height:132px;object-fit:cover;border-radius:9px;flex:none;background:var(--soft)}
.ring .nm{font-weight:700;font-size:17px}
.ring .st{font-size:14px;color:var(--muted)}
.ring .ld{font-size:13px;color:var(--muted);margin-top:4px}
.ring .row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.ring .row img{width:40px;height:40px;border-radius:6px;object-fit:cover}
.ring a{font-size:13px}
@media (max-width:420px){.ring img.big{width:96px;height:96px}}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.compare figure{margin:0}
.compare img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--soft)}
.compare figcaption{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:12px;background:var(--card)}
.choice .ic{font-size:24px;width:32px;text-align:center;flex:none}
.choice b{display:block;font-size:16px}
.choice span.s{font-size:13px;color:var(--muted)}
.choice[aria-pressed=true]{border:2px solid var(--gold);background:var(--gold-soft)}
.decided{border-radius:var(--r);padding:14px;margin-top:16px;border:2px solid var(--ok);background:var(--ok-soft)}
.decided.out{border-color:var(--grey);background:var(--grey-soft)}
.decided.done{border-color:var(--blue);background:var(--blue-soft)}
.decided.bad{border-color:var(--bad);background:var(--bad-soft)}
.decided .lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.decided .say{font-size:17px;margin:4px 0 0;line-height:1.4}
.decided .warn{font-size:13px;color:var(--bad);margin-top:6px}
.decided .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.vopt{display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:12px;text-align:left;background:var(--card);min-height:0}
.vopt img,.vopt .noimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--muted)}
.vopt b{font-size:13px;line-height:1.25}
.vopt small{font-size:11px;color:var(--muted)}
.vopt[aria-pressed=true]{border:2px solid var(--gold);background:var(--gold-soft)}
.vopt .tag{align-self:flex-start;font-size:10px;font-weight:700;border-radius:6px;padding:0 5px;background:var(--warn-soft);color:var(--warn)}
.explain{font-size:14px;background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pick{position:relative;padding:0;border-radius:10px;overflow:hidden;border:3px solid var(--ok);aspect-ratio:1;min-height:0;background:#000}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick .ck{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-size:15px;line-height:24px;text-align:center;font-weight:700}
.pick.off{border-color:var(--line)}
.pick.off img{opacity:.35;filter:grayscale(1)}
.pick.off .ck{background:#0008}
.pick .vd{position:absolute;left:4px;bottom:4px;background:#000b;color:#fff;font-size:10px;border-radius:5px;padding:0 4px}
.star{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;border:0;padding:0;min-height:0;background:#000a;color:#fff;font-size:15px;line-height:28px}
.star[aria-pressed=true]{background:#f2b632;color:#000}
.fields{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.fields label{font-size:14px;color:var(--muted)}
.fields input,.fields textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.fields textarea{min-height:60px;resize:vertical}
.next{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.next .primary{flex:1 1 220px;font-size:17px;padding:12px}
.linkbtn{border:0;background:none;padding:0;min-height:0;color:var(--blue);text-decoration:underline;font-size:14px}

/* ---------- okna ---------- */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg);padding:0;width:min(900px,calc(100vw - 24px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px #0005}
dialog::backdrop{background:#0009}
dialog .dh{position:sticky;top:0;z-index:2;background:var(--card);padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
dialog .dh .r{display:flex;align-items:center;gap:8px}
dialog .dh h2{margin:0;font-size:18px;flex:1}
dialog .db{padding:14px 16px 18px}
dialog input[type=search]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
dialog h3{font-size:14px;color:var(--muted);margin:6px 0 8px;font-weight:600}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.ropt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:6px;border-radius:12px;min-height:0}
.ropt img,.ropt .noimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:var(--soft)}
.ropt b{font-size:14px}
.ropt small{font-size:12px;color:var(--muted);line-height:1.3}
.ropt .draft{align-self:flex-start;font-size:10px;font-weight:700;border-radius:6px;padding:0 5px;background:var(--grey-soft);color:var(--grey)}
#msg .db p{margin:0 0 10px}
#msg pre{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px;font-size:13px;max-height:40vh;overflow:auto}
#msg ul{margin:0 0 10px;padding-left:20px}
#msg .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1>Posty z Facebooka <small id="sub">co trafi do katalogu pierścionków</small></h1>
  <span id="status" role="status">…</span>
  <button id="refreshBtn" class="needsync" title="Ściąga nowe posty z serwera i dopisuje je do tablicy (decyzje zostają)">Pobierz nowe posty</button>
  <button id="exportBtn" class="needsync" title="Zapisuje plik catalog-selection.json do importu szkiców">Przygotuj eksport</button>
  <a class="det" href="szczegoly.html" title="Wszystkie sekcje i decyzje pojedynczych zdjęć">Widok szczegółowy</a>
</div></header>
<div id="banner"></div>
<main id="board"></main>
<div id="focus" hidden role="dialog" aria-modal="true" aria-label="Przegląd posta"></div>
<dialog id="ringPick" aria-label="Wybierz pierścionek z katalogu"></dialog>
<dialog id="postPick" aria-label="Wybierz post z tym samym pierścionkiem"></dialog>
<dialog id="msg" aria-label="Komunikat"></dialog>
<noscript>Ta strona wymaga JavaScriptu.</noscript>
<script type="application/json" id="data">__DATA__</script>
<script>
(() => {
'use strict';
// Tablica przeglądu postów z FB. Dane: review-data.json (build_review.py). Decyzje: selection.json przez review_server.py
// (ten sam format co widok szczegółowy, szczegoly.html). „Co się stanie” liczy serwer tą samą funkcją co eksport (/api/plan).
const D = JSON.parse(document.getElementById('data').textContent);
const API = '/api/selection';
const PENDING_KEY = 'fbreview:pending';
const START_CMD = 'python3 scripts/facebook/review_server.py';
const INHERIT = { catalog: 'catalog', addto: 'gallery', material: 'material', reject: 'skip' };
const TARGETED = ['dodatek', 'zamiast-wizualizacji', 'nowy-wariant'];
const CATALOG = D.catalogCards || {};
const HINTS = D.hints || {};
const IN_CATALOG = D.inCatalog || {};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const hhmm = d => d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
const plDate = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : 'bez daty';
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').trim();
const plural = (n, one, few, many) => n === 1 ? one : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? few : many;
const nPhotos = n => `${n} ${plural(n, 'zdjęcie', 'zdjęcia', 'zdjęć')}`;
const nVideos = n => `${n} ${plural(n, 'film', 'filmy', 'filmów')}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nPosts = n => `${n} ${plural(n, 'post', 'posty', 'postów')}`;
const thumbSrc = f => f.kind === 'photo' ? 'thumbs/' + encodeURI(f.file) : (f.poster ? encodeURI(f.poster) : '');
const fullSrc = f => 'media/' + encodeURI(f.file);
const imgFallback = `onerror="if(this.dataset.f){this.onerror=null;this.src=this.dataset.f}else{this.onerror=null;this.src=BROKEN}"`;
// zastępczy obrazek, gdy zdjęcie z katalogu się nie wczyta (np. bez internetu)
window.BROKEN = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10"><rect width="10" height="10" fill="#e9e3d8"/><path d="M5 2.5 7.5 5 5 7.5 2.5 5z" fill="none" stroke="#b9ae9c" stroke-width=".4"/></svg>');
const remoteImg = (u, alt, cls) => u ? `<img src="${esc(u)}" alt="${esc(alt || '')}" class="${cls || ''}" loading="lazy" ${imgFallback}>` : `<span class="noimg ${cls || ''}">◇</span>`;

// ---------- karty (posty) ----------
// Tylko sekcje kart (nowe od…, nowe pierścionki, do decyzji). „Już w katalogu” i pominięte posty z dawnego grupowania
// zostają w widoku szczegółowym.
const SECS = [['fresh', 'nowe'], ['new', 'starsze'], ['maybe', 'starsze']];
const G = [], BY = {};
for (const [sec] of SECS) for (const it of D[sec] || []) {
  const own = [...it.photos.map(f => ({ file: f, kind: 'photo' })), ...it.videos.map(v => ({ file: v.file, kind: 'video', q: v.q, poster: v.poster }))];
  const g = { key: it.key, sec, it, own, files: own, root: it.key, members: [], date: (it.posts[0] || {}).date || '' };
  G.push(g); BY[g.key] = g;
}
const hasFresh = G.some(g => g.sec === 'fresh');

    const s1 = sug.map(s => [s, CATALOG[s]]).filter(hit);
    const s2 = all.filter(hit).filter(([s]) => !sug.includes(s));
    $('#ringList').innerHTML = (s1.length ? `<h3>Najbardziej podobne według modelu</h3><div class="rgrid">${s1.map(tile).join('')}</div>` : '') +
      (s2.length ? `<h3>${s1.length ? 'Pozostałe karty' : 'Karty w katalogu'} (${s2.length})</h3><div class="rgrid">${s2.map(tile).join('')}</div>` : '') +
      (!s1.length && !s2.length ? (Object.keys(CATALOG).length ? '<p class="muted">Nic nie pasuje do wyszukiwania.</p>' : '<p class="muted">Brak zrzutu katalogu (katalog.json). Uruchom „Pobierz nowe posty” albo w cms: npm run katalog:snapshot.</p>') : '');
  };
  dl.showModal();
  list();
  $('#ringQ').addEventListener('input', list);
  $('#ringQ').focus();
}
function postPickOpen(g) {
  pickFor = g;
  const dl = $('#postPick');
  const cand = roots().filter(x => x.key !== g.key && x.key !== g.root);
  dl.innerHTML = `<div class="dh"><div class="r"><h2>Na którym poście jest ten sam pierścionek?</h2><button type="button" data-act="dlgClose" aria-label="Zamknij">✕</button></div>` +
    `<div class="muted" style="font-size:14px">Ten post dołączy do wybranego. Zdjęcia obu będą razem, a decyzję podejmiesz raz, przy wybranym poście.</div></div>` +
    `<div class="db"><div class="rgrid">${cand.map(x => { const f = coverFile(x); return `<button type="button" class="ropt" data-act="postChosen" data-key="${esc(x.key)}">` +
      `${f && thumbSrc(f) ? `<img src="${thumbSrc(f)}" data-f="${f.kind === 'photo' ? fullSrc(f) : ''}" ${imgFallback} alt="" loading="lazy">` : '<span class="noimg"></span>'}<b>${esc(x.it.title)}</b><small>${esc(plDate(x.date))}</small>${chip(x, outcome(x))}</button>`; }).join('')}</div></div>`;
  dl.showModal();
}

// ---------- komunikaty (zamiast alert) ----------
function message(title, html, buttons) {
  const dl = $('#msg');
  dl.innerHTML = `<div class="dh"><div class="r"><h2>${esc(title)}</h2>${buttons === false ? '' : '<button type="button" data-act="dlgClose" aria-label="Zamknij">✕</button>'}</div></div><div class="db">${html}` +
    (buttons && buttons.length ? `<div class="acts">${buttons.join('')}</div>` : '') + `</div>`;
  if (!dl.open) dl.showModal();
}
async function flushSaves() {
  clearTimeout(saveTimer);
  for (let i = 0; i < 5 && seq !== savedSeq && !conflict; i++) { await save(); if (seq !== savedSeq) await new Promise(r => setTimeout(r, 400)); }
  return !conflict && seq === savedSeq;
}
async function exportAsk() {
  if (!loaded) return;
  if (!(await flushSaves())) { message('Najpierw zapis', '<p>Decyzje jeszcze się nie zapisały (zobacz czerwony komunikat u góry).</p>'); return; }
  await new Promise(r => { loadPlan(); setTimeout(r, 400); });
  const c = columns();
  const all = G.filter(g => !isMerged(g));
  const kinds = {};
  for (const g of all) { const k = outcome(g).kind; kinds[k] = (kinds[k] || 0) + 1; }
  const rows = [
    [kinds.new, 'nowych pierścionków (szkice kart)'], [(kinds.toExisting || 0) + (kinds.gallery || 0), 'postów ze zdjęciami do istniejących kart (wersje robocze)'],
    [kinds.material, 'postów w materiałach'],
  ].filter(([n]) => n).map(([n, t]) => `<li><b>${n}</b> ${t}</li>`).join('');
  const todo = c.todo.length ? `<p class="muted">${nPosts(c.todo.length)} bez decyzji ${plural(c.todo.length, 'zostanie', 'zostaną', 'zostanie')} pominięte.</p>` : '';
  const warns = PLAN && PLAN.warnings && PLAN.warnings.length ? `<details><summary>Uwagi eksportu (${PLAN.warnings.length})</summary><pre>${esc(PLAN.warnings.join('\n'))}</pre></details>` : '';
  message('Przygotować eksport?', `<p>Zapiszę plik <code>data/facebook/catalog-selection.json</code> ze wszystkich decyzji (także starszych). Strona i panel na razie się nie zmienią.</p><ul>${rows || '<li>nic do katalogu</li>'}</ul>${todo}${warns}`,
    ['<button type="button" data-act="dlgClose">Anuluj</button>', '<button type="button" class="primary" data-act="doExport">Zapisz plik eksportu</button>']);
}
async function doExport() {
  message('Eksport…', '<p>Zapisuję plik…</p>', false);
  try {
    const r = await api('POST', '/api/export');
    if (!r.ok || !r.data || !r.data.ok) throw new Error((r.data && r.data.error) || 'HTTP ' + r.status);
    message('Plik eksportu gotowy', `<p>${esc(r.data.summary)}</p><p><b>Następny krok</b> robisz w terminalu (zapisuje do bazy strony, zawsze jako szkic lub wersja robocza):</p>` +
      `<pre>cd cms\nnpm run fb:do-istniejacych            # na sucho: pokaże, co się zmieni\nnpm run fb:do-istniejacych -- --apply # zapis (poprosi o słowo PRODUKCJA)</pre>` +
      `<p class="muted">Nowe karty: import z <code>catalog-selection.json</code> (scripts/import-fb-catalog.ts). Na stronie nic się nie zmieni, dopóki nie opublikujesz w panelu.</p>`,
      ['<button type="button" class="primary" data-act="dlgClose">OK</button>']);
  } catch (e) { message('Eksport się nie udał', `<pre>${esc(e.message)}</pre>`, ['<button type="button" data-act="dlgClose">Zamknij</button>']); }
}
async function doRefresh() {
  if (!loaded || refreshing) return;
  if (!(await flushSaves())) { message('Najpierw zapis', '<p>Decyzje jeszcze się nie zapisały (zobacz czerwony komunikat u góry).</p>'); return; }
  refreshing = true;
  const btn = $('#refreshBtn');
  btn.disabled = true; btn.textContent = 'Pobieram…';
  message('Pobieram nowe posty', '<p>Ściągam kopię z serwera, dopisuję nowe posty i proszę model o podpowiedzi. To może potrwać kilka minut; możesz zostawić to okno.</p>', false);
  try {
    const r = await api('POST', '/api/refresh', undefined, 45 * 60 * 1000);
    const d = r.data || {};
    const info = esc((d.lines || []).join('\n'));
    if (d.rebuilt) {
      message('Gotowe', `<p>Nowe posty: <b>${d.added}</b>. Odświeżam tablicę…</p><pre>${info}</pre>`, false);
      setTimeout(() => location.reload(), 1200);
      return;
    }
    if (!r.ok || !d.ok) throw new Error((d.lines || []).join('\n') || d.error || 'HTTP ' + r.status);
    message(d.added ? 'Gotowe' : 'Brak nowych postów', `<pre>${info}</pre>`, ['<button type="button" class="primary" data-act="dlgClose">OK</button>']);
  } catch (e) {
    message('Pobieranie się nie udało', `<pre>${esc(e.name === 'AbortError' ? 'brak odpowiedzi serwera' : e.message)}</pre>`, ['<button type="button" data-act="dlgClose">Zamknij</button>']);
  } finally { refreshing = false; btn.disabled = false; btn.textContent = 'Pobierz nowe posty'; updateStatus(); }
}

// ---------- zdarzenia ----------
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act],[data-open],[data-scope]');
  if (!t) return;
  if (t.dataset.open) { openPost(t.dataset.open, false); return; }
  if (t.dataset.scope) { scope = t.dataset.scope; try { localStorage.setItem('fbreview:scope', scope); } catch (e) { /* ok */ } renderBoard(); return; }
  const act = t.dataset.act, g = BY[F.key];
  const dlg = t.closest('dialog');
  switch (act) {
    case 'retry': clearTimeout(retryTimer); if (!loaded) await load(true); else if (seq !== savedSeq) save(); else await load(false); return;
    case 'reload': conflict = false; await load(false); try { localStorage.removeItem(PENDING_KEY); } catch (e) { /* ok */ } return;
    case 'force': serverRev = Number(t.dataset.rev) || 0; conflict = false; banner(''); save(); return;
    case 'sendPending': {
      let p = null; try { p = JSON.parse(localStorage.getItem(PENDING_KEY)); } catch (e) { /* brak */ }
      if (p && p.state) { const rev = serverRev; S = normalize(p.state); S.rev = serverRev = rev; seq = 1; savedSeq = 0; rebuildMerge(); }
      lock(false); banner(''); render(); save(); return;
    }
    case 'dropPending': try { localStorage.removeItem(PENDING_KEY); } catch (e) { /* ok */ } lock(false); banner(''); return;
    case 'expand': expanded.add(t.dataset.col); renderBoard(); return;
    case 'startQueue': { const first = todoList()[0]; if (first) openPost(first.key, true); return; }
    case 'dlgClose': if (dlg) dlg.close(); return;
    case 'doExport': doExport(); return;
  }
  if (!g) return;
  switch (act) {
    case 'close': closePost(); return;
    case 'prev': case 'next': { const l = navList(), at = l.findIndex(x => x.key === g.key || x.key === g.root); const n = l[at + (act === 'prev' ? -1 : 1)]; if (n) openPost(n.key); return; }
    case 'nextTodo': { const n = nextTodo(g.key); if (n) openPost(n.key); else closePost(); return; }
    case 'show': showFile(Number(t.dataset.i)); return;
    case 'choose': F.step = 'choose'; renderFocus(false); return;
    case 'cancelChoose': F.step = null; renderFocus(false); return;
    case 'new': F.step = null; decideNew(g); return;
    case 'material': F.step = null; decideSimple(g, 'material'); return;
    case 'reject': F.step = null; decideSimple(g, 'reject'); return;
    case 'undecide': F.step = null; undecide(g); return;
    case 'pickRing': ringPickOpen(g); return;
    case 'pickPost': postPickOpen(g); return;
    case 'ring': {
      const slug = t.dataset.slug, v = matchVariant(slug, t.dataset.variant);
      F.step = null;
      decideRing(g, slug, v ? { stone: v.stone, vis: v.vis } : null);
      return;
    }
    case 'ringChosen': if (dlg) dlg.close(); F.step = null; decideRing(pickFor || g, t.dataset.slug, null); return;
    case 'postChosen': if (dlg) dlg.close(); F.step = null; mergeInto(pickFor || g, BY[t.dataset.key]); return;
    case 'openRoot': openPost(g.root); return;
    case 'unmerge': unmerge(g); return;
    case 'variant': { const e = ensure(g); setVariant(e, e.product, t.dataset.stone, !!t.dataset.vis); changed(); return; }
    case 'customStone': {
      const e = ensure(g);
      message('Inny kamień', `<p>Jak nazywa się kamień na zdjęciach? (np. Turmalin, Ametyst)</p><div class="fields"><input id="stoneQ" type="text" value="${esc(e.variant && !matchVariant(e.product, e.variant) ? e.variant : '')}"></div>`,
        ['<button type="button" data-act="dlgClose">Anuluj</button>', '<button type="button" class="primary" data-act="stoneOk">Zapisz</button>']);
      $('#stoneQ').focus();
      return;
    }
    case 'toggleFile': toggleFile(g, t.dataset.file); return;
    case 'cover': setCover(g, t.dataset.file); return;
  }
});
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act=stoneOk]');
  if (!t) return;
  const g = BY[F.key], v = ($('#stoneQ').value || '').trim();
  $('#msg').close();
  if (!g || !v) return;
  const e = ensure(g);
  setVariant(e, e.product, v, false);
  changed();
});
document.addEventListener('keydown', ev => {
  if (ev.target.id === 'stoneQ' && ev.key === 'Enter') { ev.preventDefault(); $('[data-act=stoneOk]').click(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (!t.dataset || !t.dataset.f || !F.key) return;
  const g = BY[F.key], e = ensure(g), val = t.value;
  if (t.dataset.f === 'name') { if (!val.trim()) delete e.name; else e.name = val; }
  else if (t.dataset.f === 'note') { if (!val.trim()) delete e.note; else e.note = val; }
  prune(g);
  seq++;
  try { localStorage.setItem(PENDING_KEY, JSON.stringify({ ts: Date.now(), state: S })); } catch (e2) { /* ok */ }
  scheduleSave(700);
});
document.addEventListener('keydown', ev => {
  if (!F.key || document.querySelector('dialog[open]')) return;
  const tag = (ev.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const g = BY[F.key];
  if (ev.key === 'Escape') closePost();
  else if (ev.key === 'ArrowRight') showFile(F.i + 1);
  else if (ev.key === 'ArrowLeft') showFile(F.i - 1);
  else if (ev.key === 'Enter' && ev.target === document.body) { const n = nextTodo(g.key); if (n) openPost(n.key); }
  else return;
  ev.preventDefault();
});
window.addEventListener('popstate', () => {
  const m = location.hash.match(/^#post=(.+)$/);
  if (m && BY[decodeURIComponent(m[1])]) openPost(decodeURIComponent(m[1]));
  else if (F.key) closePost(true);
});
$('#exportBtn').addEventListener('click', exportAsk);
$('#refreshBtn').addEventListener('click', doRefresh);

// ---------- start ----------
rebuildMerge();
renderBoard();
lock(true);
(async function boot() {
  const ok = await load(true);
  const m = location.hash.match(/^#post=(.+)$/);
  if (m && BY[decodeURIComponent(m[1])]) openPost(decodeURIComponent(m[1]));
  if (!ok) { const t = setInterval(async () => { if (await load(true)) clearInterval(t); }, 3000); }
})();
})();
</script>
