<!doctype html>

:root{--czerwony:#9E2235;--niebieski:#2F4F8F;--granatowy:#1E2A55;--jasnoniebieski:#7FA8CF;--fioletowy:#6B4B8C;--zielony:#2F6B4F;--rozowy:#D98A9E;--zolty:#D2A92E;--bialy:#FBFBF8}
